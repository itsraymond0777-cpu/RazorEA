name: Build Razor EA APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Extract and setup project
        run: |
          unzip RazorEA_AndroidProject.zip || true
          ls -la
          [ -d RazorEA ] && cp -r RazorEA/. . || true
          ls -la
          chmod +x gradlew
      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace 2>&1 | tail -100
        env:
          GRADLE_OPTS: "-Xmx3g -Dorg.gradle.daemon=false"
      - uses: actions/upload-artifact@v3
        with:
          name: RazorEA-APK
          path: app/build/outputs/apk/debug/app-debug.apk
