name: Build Razor EA APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Verify files
      - name: Show repository files
        run: ls -R

      # Extract project if ZIP exists
      - name: Extract Android Project
        run: |
          if [ -f RazorEA_AndroidProject.zip ]; then
            unzip -o RazorEA_AndroidProject.zip
          fi

      # Find project directory automatically
      - name: Locate Gradle project
        run: |
          if [ -f gradlew ]; then
            echo "Gradle wrapper found in root"
          else
            PROJECT_DIR=$(find . -name gradlew | head -n 1 | xargs dirname)

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: gradlew not found"
              exit 1
            fi

            echo "Found project at $PROJECT_DIR"
            cp -r $PROJECT_DIR/* .
          fi

      # Give permission to gradlew
      - name: Make gradlew executable
        run: chmod +x gradlew

      # Build APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        env:
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.daemon=false"

      # Upload APK artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RazorEA-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
